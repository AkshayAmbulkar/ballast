[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ballast"
version = "0.1.0"
description = "Multi-asset portfolio risk platform: market data, positions, P&L, fixed income, derivatives and risk on PostgreSQL."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Akshay Ambulkar" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "requests>=2.31",
    "scipy>=1.11",
    "yfinance>=0.2.54",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ballast = "ballast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
