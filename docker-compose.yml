services:
  db:
    image: postgres:16
    container_name: ballast-db
    environment:
      POSTGRES_USER: ballast
      POSTGRES_PASSWORD: ballast
      POSTGRES_DB: ballast
    ports:
      - "127.0.0.1:5432:5432"   # localhost only: not reachable from other devices on your network
    volumes:
      - ballast-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ballast -d ballast"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ballast-pgdata:
